<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POI // 学词终端</title>
<!-- 内联 data-URI favicon：16x16 单色琥珀方块。纯粹为了让浏览器别再去要
     /favicon.ico（那个 404 在 Edge / E2E 控制台里刷屏）。不新增静态文件。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='16'%20height='16'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%23ffb454'/%3E%3C/svg%3E">
<!--
  单文件播放器（DESIGN.md §4）。无外部依赖、无 CDN、无浏览器存储 API。
  界面为多界面结构：顶部 tab 切换（播放 / 内容库 / 生词本 / 复习），VIEWS 数组加一行即多一个界面。
  设定值全部集中在 JS 顶部的 CONF；坐标一律以 1920x1080 参考帧为准，
  渲染时按 <video> 实际显示区域（含 letterbox 偏移）换算。
-->
<style>
:root{
  --bg:#04060a;        /* 近黑底 */
  --panel:#080d13;
  --panel-2:#0c131b;
  --line:#1a2733;      /* 细分隔线 */
  --fg:#c3d2dd;
  --dim:#61758a;
  --acc:#3ff08a;       /* 终端绿 */
  --amber:#ffb454;     /* 琥珀 */
  --white:#e9f2f7;     /* POI 监视白框 */
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:13px/1.5 var(--mono); letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
}
/* 极克制的扫描线 + 噪点：默认弱到不干扰阅读 */
#grain{
  position:fixed; inset:0; z-index:90; pointer-events:none; opacity:.5;
  background:
    repeating-linear-gradient(rgba(255,255,255,.020) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(circle at 50% 0%, rgba(63,240,138,.05), rgba(0,0,0,0) 60%);
}
button, select, input{font:inherit; color:inherit}
button{
  background:var(--panel-2); border:1px solid var(--line); color:var(--fg);
  padding:5px 10px; cursor:pointer; border-radius:2px;
}
button:hover{border-color:var(--dim); color:var(--white)}
button:disabled{opacity:.45; cursor:default}
select{
  background:var(--panel-2); border:1px solid var(--line); color:var(--fg);
  padding:5px 8px; border-radius:2px; max-width:46vw;
}
.k{color:var(--dim)}
.acc{color:var(--acc)}

/* ---------- 顶栏 ---------- */
header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:9px 16px; border-bottom:1px solid var(--line); background:var(--panel);
}
.brand{color:var(--acc); font-weight:700; letter-spacing:.16em}
.brand span{color:var(--dim); font-weight:400; letter-spacing:.02em; margin-left:6px}
.spacer{flex:1}

/* 界面切换：终端风 tab（[ 播放 ] [ 生词本 ]），加界面就在 VIEWS 里加一行 */
#tabs{display:flex; gap:6px}
#tabs button{
  background:transparent; border:1px solid transparent; color:var(--dim);
  letter-spacing:.10em; padding:4px 6px;
}
#tabs button:hover{color:var(--fg)}
#tabs button.on{color:var(--acc); border-color:var(--line); background:rgba(63,240,138,.08)}

.modes{display:flex; gap:0; border:1px solid var(--line); border-radius:2px; overflow:hidden}
.modes button{border:0; border-right:1px solid var(--line); border-radius:0; background:transparent}
.modes button:last-child{border-right:0}
.modes button.on{background:rgba(63,240,138,.10); color:var(--acc); box-shadow:inset 0 -2px 0 var(--acc)}
label.chk{display:flex; align-items:center; gap:6px; color:var(--dim); cursor:pointer}
label.chk input{accent-color:var(--acc)}
/* 播放界面专属的顶栏控件：切到别的界面就收起来 */
body:not([data-view="play"]) .playonly{display:none}

/* ---------- 状态行 ---------- */
#statusbar{
  display:flex; align-items:center; gap:10px; padding:5px 16px;
  border-bottom:1px solid var(--line); background:var(--bg); color:var(--dim);
  font-size:12px; min-height:27px;
}
#dot{width:7px; height:7px; border-radius:50%; background:var(--acc); box-shadow:0 0 6px var(--acc)}
#dot.warn{background:var(--amber); box-shadow:0 0 6px var(--amber)}
#dot.err{background:#ff5d5d; box-shadow:0 0 6px #ff5d5d}

/* ---------- 界面容器 ---------- */
main{padding:16px; max-width:1680px; margin:0 auto}
.view{display:none}
.view.on{display:block}

/* ---------- 播放界面 ---------- */
#stage{
  position:relative; background:#000; border:1px solid var(--line);
  line-height:0;
}
#stage video{display:block; width:100%; aspect-ratio:16/9; max-height:74vh;
  background:#000; object-fit:contain}
/* POI 监视框：四角括号 */
.corner{position:absolute; width:18px; height:18px; border:1px solid var(--white);
  opacity:.55; pointer-events:none; z-index:5}
.corner.tl{top:6px; left:6px; border-right:0; border-bottom:0}
.corner.tr{top:6px; right:6px; border-left:0; border-bottom:0}
.corner.bl{bottom:6px; left:6px; border-right:0; border-top:0}
.corner.br{bottom:6px; right:6px; border-left:0; border-top:0}

#layer{position:absolute; inset:0; z-index:4; pointer-events:none}
#layer > *{pointer-events:none}

/* 遮罩带：不是黑条。
   canvas 档（默认）：画面降采样 + 高亮抑制后原样贴回来，只是没有字；
   CSS 降级档：backdrop-filter 模糊，底色不透明度上限 .35（禁止黑条）。 */
.mask{
  position:absolute; display:none; overflow:hidden;
  /* 底档（也是降级档）：轻模糊 + 不透明度上限 .35 的极淡底色。
     canvas 画出来之后会把这层完全盖住；首帧解出来之前也不会漏字。 */
  background:rgba(6,9,13,.30);
  backdrop-filter:blur(18px) saturate(.9) brightness(.85);
  -webkit-backdrop-filter:blur(18px) saturate(.9) brightness(.85);
}
.mask.on{display:block}
.mask.cssblur{border-top:1px solid rgba(255,255,255,.05)}
#maskcv{
  display:block; position:absolute; left:0; width:100%;
  /* top / height 由 JS 按取样区设（比遮罩带高出 PAD 行，多出来的被裁掉）。
     小画布 CSS 放大（浏览器插值）+ 轻微模糊：块感抹平，像画面自然延续。 */
  filter:blur(9px) saturate(.98);
  transform:scaleX(1.03);       /* 横向撑一点，别让模糊在左右边缘咬出透明缝 */
  transform-origin:center;
}
.mask.cssblur #maskcv{display:none}

/* 词框热区：平时全透明，hover 才描白框（机器盯梢） */
.hot{
  position:absolute; pointer-events:auto; cursor:pointer;
  border:1px solid transparent; border-radius:1px;
  transition:border-color .08s linear, background-color .08s linear;
}
.hot:hover, .hot.act{
  border-color:rgba(233,242,247,.92);
  background:rgba(233,242,247,.10);
  box-shadow:0 0 0 1px rgba(0,0,0,.55);
}

/* 退路：自渲染可点击英文字幕行 */
#fbline{
  position:absolute; display:none; align-items:center; justify-content:center;
  text-align:center; padding:0 3%; line-height:1.15;
  color:var(--white); text-shadow:0 2px 6px #000;
  font-family:var(--mono); pointer-events:none;
}
#fbline.on{display:flex}
#fbline .tk{pointer-events:auto; cursor:pointer; border-bottom:1px solid transparent}
#fbline .tk:hover{color:var(--acc); border-bottom-color:var(--acc)}

/* ---------- 播放控制（自绘，避免原生控件与遮罩/热区抢点击） ---------- */
#controls{
  display:flex; align-items:center; gap:12px; margin-top:10px;
  padding:8px 12px; border:1px solid var(--line); background:var(--panel);
}
#seek{flex:1; accent-color:var(--acc); background:transparent; cursor:pointer}
#time{color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap}
#segline{
  margin-top:10px; padding:8px 12px; border:1px solid var(--line);
  background:var(--panel); color:var(--dim); min-height:36px;
}
#segline b{color:var(--fg); font-weight:400}

/* ---------- 查询卡：机器标记卡片 ---------- */
#card{
  position:fixed; right:22px; bottom:22px; width:min(390px, 92vw); z-index:70;
  display:none; background:var(--panel); border:1px solid var(--line);
  box-shadow:0 12px 40px rgba(0,0,0,.65); max-height:86vh; overflow:auto;
}
#card.on{display:block}
body:not([data-view="play"]) #card{display:none}
#card::before, #card::after{
  content:""; position:absolute; width:12px; height:12px; border:1px solid var(--white);
  opacity:.7; pointer-events:none;
}
#card::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
#card::after{bottom:-1px; right:-1px; border-left:0; border-top:0}
.cardtop{
  display:flex; align-items:center; gap:8px; padding:6px 10px;
  border-bottom:1px solid var(--line); background:linear-gradient(
    to right, rgba(63,240,138,.10), rgba(0,0,0,0));
  font-size:11px; letter-spacing:.14em; color:var(--acc);
}
.cardtop .x{margin-left:auto; color:var(--dim); cursor:pointer; letter-spacing:0}
.cardtop .x:hover{color:var(--white)}
.cardbody{padding:12px 14px 14px}
.row{display:flex; gap:10px; margin-bottom:7px}
.row .lb{color:var(--dim); flex:0 0 62px; font-size:12px}
.row .vl{flex:1; color:var(--fg); word-break:break-word}
.surface{color:var(--white); font-size:19px; letter-spacing:.03em}
.lemma{color:var(--acc); font-size:15px}
.ipa{color:var(--amber)}
.gloss div{margin-bottom:2px}
.sent{
  margin-top:10px; padding:9px 10px; border-left:2px solid var(--line);
  background:var(--panel-2); color:var(--dim); line-height:1.7;
}
.sent .tk{cursor:pointer; color:var(--fg)}
.sent .tk:hover{color:var(--acc)}
.sent .tk.hl{color:#04060a; background:var(--acc); padding:0 2px}
.notice{color:var(--amber); margin-top:8px; font-size:12px}
.cardfoot{display:flex; align-items:center; gap:10px; margin-top:12px}
#collectBtn{border-color:var(--acc); color:var(--acc)}
#collectBtn:hover{background:rgba(63,240,138,.12)}
#collectBtn.done{border-color:var(--line); color:var(--dim); background:transparent}
#collectMsg{color:var(--dim); font-size:12px}

/* ---------- 助记区（查询卡 / 生词本共用一套渲染） ---------- */
.mnemo{margin-top:11px; padding-top:9px; border-top:1px dashed var(--line)}
.mnemo[data-state="none"]{display:none; margin:0; padding:0; border:0}
.mnemo .mhead{color:var(--dim); font-size:11px; letter-spacing:.14em; margin-bottom:6px}
.mnemo .mgloss{color:var(--white); line-height:1.65; white-space:pre-wrap}
.mnemo .hook{margin-top:7px; line-height:1.6}
.mnemo .hook .badge{
  display:inline-block; margin-right:6px; padding:0 5px;
  border:1px solid var(--line); background:var(--panel-2);
  color:var(--acc); font-size:11px; letter-spacing:.08em; vertical-align:1px;
}
.mnemo .hook .htext{color:var(--fg); white-space:pre-wrap}
/* 免责标签：小字弱化，在场但不抢戏 */
.mnemo .hook .lbl{display:block; color:var(--dim); font-size:10px; opacity:.75; margin-top:1px}
.mnemo .wait{color:var(--dim)}
.mnemo .wait::after{content:""}

/* ---------- 生词本 / 内容库 / 复习 界面（全屏） ---------- */
#vbar, #libbar, #rbar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:8px 12px; border:1px solid var(--line); background:var(--panel);
  color:var(--acc); font-size:11px; letter-spacing:.14em; margin-bottom:12px;
}
#vbar .cnt, #libbar .cnt, #rbar .cnt{color:var(--dim); letter-spacing:.02em; font-size:12px}
#vbar .spacer, #libbar .spacer, #rbar .spacer{flex:1}
#vbar button, #libbar button, #rbar button{letter-spacing:.02em}
#vlist{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill, minmax(330px, 1fr));
  align-items:start;
}
.vcard{border:1px solid var(--line); background:var(--panel-2); padding:12px 13px 13px}
.vcard .top{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.vcard .lm{color:var(--white); font-size:17px; letter-spacing:.03em}
.vcard .ip{color:var(--amber); font-size:12px}
.vcard .ps{color:var(--dim); font-size:11px}
.vcard .n{color:var(--dim); font-size:11px; margin-left:auto}
.vcard .gl{color:var(--fg); margin-top:6px; font-size:12px; line-height:1.6}
.vcard .gl div{margin-bottom:2px}
.vcard .encs{margin-top:9px; padding-top:8px; border-top:1px dashed var(--line)}
.vcard .encs .eh{color:var(--dim); font-size:11px; letter-spacing:.14em; margin-bottom:5px}
.vcard .enc{color:var(--dim); font-size:12px; line-height:1.65; margin-bottom:8px}
.vcard .enc .ehead{display:flex; align-items:center; gap:8px}
/* 网页来源的标题可以很长：截断，别把 surface 挤出卡片（工单 11） */
.vcard .enc .ehead .meta{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.vcard .enc .body{color:var(--fg); margin-top:1px}
.vcard .enc em{color:var(--acc); font-style:normal}
.vcard .enc .jump{
  margin-left:auto; flex:0 0 auto; padding:1px 6px; font-size:11px; color:var(--dim);
  background:transparent; border:1px solid var(--line);
}
.vcard .enc .jump:hover{color:var(--acc); border-color:var(--acc)}
.empty{color:var(--dim); padding:18px 2px; line-height:1.9; white-space:pre-line}

/* ---------- 内容库界面（工单 12） ---------- */
#liblist{border:1px solid var(--line); background:var(--panel-2)}
.lrow{
  display:grid; gap:12px; align-items:center; padding:8px 11px;
  grid-template-columns:92px minmax(160px,1fr) 72px 84px 96px minmax(120px,1.1fr);
  border-bottom:1px solid var(--line); cursor:pointer;
}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:rgba(63,240,138,.06)}
.lrow.head{
  cursor:default; background:var(--panel); color:var(--dim);
  font-size:11px; letter-spacing:.14em;
}
.lrow.head:hover{background:var(--panel)}
.lrow .se{color:var(--acc)}
.lrow .ti{color:var(--white); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lrow .num, .lrow .dur{color:var(--dim); font-variant-numeric:tabular-nums}
.lrow .bx{color:var(--dim)}
.lrow .bx.on{color:var(--acc)}
.lrow .ms{color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lrow .ms.warn{color:var(--amber)}
.lrow .ms.err{color:#ff5d5d}

/* 导入表单 */
#impbox{margin-top:18px; border:1px solid var(--line); background:var(--panel)}
#impbox .imphead{
  padding:8px 12px; border-bottom:1px solid var(--line);
  color:var(--acc); font-size:11px; letter-spacing:.14em;
}
#impForm{padding:12px 12px 4px}
.fld{display:flex; align-items:center; gap:10px; margin-bottom:9px; flex-wrap:wrap}
.fld > label{flex:0 0 172px; color:var(--dim); font-size:12px}
.fld input[type="text"]{
  flex:1; min-width:180px; padding:5px 8px; border-radius:2px;
  background:var(--panel-2); border:1px solid var(--line); color:var(--fg);
}
.fld input[type="file"]{flex:1; min-width:200px; color:var(--dim); font-size:12px}
.fld input[type="file"]::file-selector-button{
  font:inherit; margin-right:8px; padding:4px 9px; cursor:pointer; border-radius:2px;
  background:var(--panel-2); border:1px solid var(--line); color:var(--fg);
}
.fld .hint{color:var(--dim); font-size:11px; flex-basis:100%; padding-left:182px}
.impfoot{display:flex; align-items:center; gap:12px; margin:12px 0 4px}
#impBtn{border-color:var(--acc); color:var(--acc)}
#impBtn:hover:not(:disabled){background:rgba(63,240,138,.12)}
#impMsg{color:var(--dim); font-size:12px}
#impMsg.err{color:#ff5d5d}
#impMsg.ok{color:var(--acc)}
#impProg{padding:2px 12px 12px}
#impProg[data-state="idle"]{display:none}
.pstage{display:flex; align-items:center; gap:10px; margin-top:7px; font-size:12px; color:var(--dim)}
.pstage .pl{flex:0 0 96px}
.pstage .pbar{flex:1; height:7px; border:1px solid var(--line); background:var(--panel-2)}
.pstage .pbar i{display:block; height:100%; width:0; background:var(--acc); transition:width .12s linear}
.pstage .pv{flex:0 0 132px; text-align:right; font-variant-numeric:tabular-nums}
.pstage[data-state="run"] .pl, .pstage[data-state="done"] .pl{color:var(--fg)}
.pstage[data-state="done"] .pv{color:var(--acc)}
.pstage[data-state="err"] .pl, .pstage[data-state="err"] .pv{color:#ff5d5d}
.pstage[data-state="err"] .pbar i{background:#ff5d5d}
#impWarn{color:var(--amber); font-size:12px; margin-top:9px; white-space:pre-line}

/* ---------- 复习界面（工单 14：翻卡 + 会/不会 + 间隔重复简化版） ---------- */
#rbar .rule{color:var(--dim); letter-spacing:.02em; font-size:12px}
#rbar .dist{color:var(--dim); letter-spacing:.02em; font-size:12px}
/* 失败态：一行错误 + 重试按钮（API 死掉也不许把界面卡在"载入中"） */
#rerr{
  display:flex; align-items:center; gap:12px; margin-bottom:12px;
  padding:8px 12px; border:1px solid #47232a; background:rgba(255,93,93,.07);
  color:#ff5d5d; font-size:12px;
}
#rerr[hidden]{display:none}          /* display:flex 会盖掉 hidden，必须显式压回去 */
#rerr button{color:var(--fg); letter-spacing:.02em}
#rerr button:hover{color:var(--white); border-color:var(--dim)}
#rdeck{min-height:140px}
#rdeck .rloading{color:var(--dim)}

/* 复习卡：POI 监视框同款四角括号 */
.rcard{
  position:relative; max-width:760px; margin:0 auto;
  border:1px solid var(--line); background:var(--panel-2);
  padding:15px 18px 14px; cursor:pointer;
}
.rcard::before, .rcard::after{
  content:""; position:absolute; width:12px; height:12px; border:1px solid var(--white);
  opacity:.55; pointer-events:none;
}
.rcard::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.rcard::after{bottom:-1px; right:-1px; border-left:0; border-top:0}
.rcard .rhead{
  display:flex; align-items:center; gap:10px; padding-bottom:8px; margin-bottom:12px;
  border-bottom:1px dashed var(--line); color:var(--dim);
  font-size:11px; letter-spacing:.12em;
}
.rcard .rhead .rmeta{color:var(--acc)}
.rcard .rhead .rdue{color:var(--amber)}
.rcard .rhead .rhint{margin-left:auto; letter-spacing:.02em}
.rcard .rlemma{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.rcard .rlemma .lmtext{color:var(--white); font-size:29px; letter-spacing:.04em}
.rcard .rlemma .rpos{color:var(--dim); font-size:12px}
.rcard .ripa{color:var(--amber); font-size:13px; margin-top:5px; min-height:19px}
.rcard .rsent{
  margin-top:13px; padding:9px 11px; border-left:2px solid var(--line);
  background:var(--panel);
}
.rcard .rsent .smeta{
  display:flex; align-items:center; gap:10px; margin-bottom:5px;
  color:var(--dim); font-size:11px;
}
.rcard .rsent .smeta .meta{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rcard .rsent .smeta .jump{
  margin-left:auto; flex:0 0 auto; padding:1px 6px; font-size:11px; color:var(--dim);
  background:transparent; border:1px solid var(--line);
}
.rcard .rsent .smeta .jump:hover{color:var(--acc); border-color:var(--acc)}
.rcard .rsent .sbody{color:var(--fg); font-size:14px; line-height:1.85}
/* 遮挡格固定三格：不按词长给，免得数格子就把答案猜出来 */
.rcard .rsent .blank{color:var(--amber); letter-spacing:.08em; opacity:.9}
.rcard .rsent .hit{color:#04060a; background:var(--acc); padding:0 3px}
.rcard .rback{margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
.rcard[data-state="front"] .rback{display:none}
.rcard .rgloss{color:var(--white); line-height:1.7}
.rcard .rgloss div{margin-bottom:2px}
.rcard .rgloss .k{color:var(--dim)}
/* 助记没有 / 生成失败：整区不占地方（DESIGN §5 助记是旁路，缺了照样复习） */

<body data-view="play">

<script>
(function(){
"use strict";

/* ========== 常量（DESIGN §4；1080p 参考帧坐标，换片源改这里） ========== */
var CONF = {
  REF_W: 1920,
  REF_H: 1080,
  CN_BAND: [958, 1030],    // 中文行（档 2 遮这里；下沿含中文字脚，英文词框实测 1031 起）
  EN_BAND: [1026, 1080],   // 英文行（烧录字幕，热区盖这里）
  HOT_PAD: 3,              // 热区四周外扩（参考帧像素），便于点中
  BOX_MIN_RATIO: 0.5,      // 有效词框比例低于此值 → 该段走自渲染退路
  SYNC_MS: 120,            // 兜底轮询（timeupdate 约 4Hz，不够跟手）

  /* 遮罩：canvas 高亮抑制（"忽略白色"的自然模糊，不是黑条）。
     取样时向带外多取 PAD 行——那几行在字幕之上、必定没有字，正好当"背景"。
     每列取 pad 行的中位数得到该列背景色，带内像素与背景色亮度差越大
     （白字、黑描边）越往背景色靠，差得少的（真画面内容）原样留着。
     最后 CSS 放大 + 轻模糊 → 看起来像画面自然延续、只是没有字。
     强度调这里：FLOOR 越小越狠，RANGE 越小越狠，STRENGTH 是总闸。 */
  MASK: {
    PAD: 12,         // 带外参考行（参考帧像素）
    DOWN_X: 16,      // 横向降采样倍率（1/16）
    DOWN_Y: 6,       // 纵向降采样倍率（带本来就矮，别降太狠）
    MIN_W: 8, MAX_W: 320,
    MIN_H: 5, MAX_H: 64,
    WIN: 2,          // 背景色横向中位数窗口半径（降采样后像素）
    FLOOR: 3,        // 与背景亮度差小于此值 = 画面内容，保留
    RANGE: 14,       // 差值超过 FLOOR+RANGE 就整块按背景色重画
    STRENGTH: 1.0,   // 总强度 0..1（0 = 只剩模糊）
    BUDGET_MS: 6,    // 单帧处理耗时红线（设计目标 <3ms，留一倍余量）
    OVER_LIMIT: 24   // 连续超红线这么多帧 → 降级到 CSS 档
  },

  /* 助记轮询（DESIGN §5：LLM 异步，前端轮询 /mnemonic） */
  MNEMO: {
    POLL_MS: 2000,   // 查询卡打开期间的轮询间隔
    MAX_MS: 30000    // 最多轮询这么久，之后停手（生词本界面手动刷新）
  },

  /* 导入剧集的作业轮询（工单 12：合并/入库在服务端后台线程里跑） */
  IMPORT: {
    POLL_MS: 500,
    MAX_MS: 6 * 3600 * 1000   // 一集正片合并可能几十分钟，上限给足
  },

  /* 复习（工单 14；调度规则住在 app/review.py，前端只显示 rules 里吐出来的口径） */
  REVIEW: {
    LIMIT: 20,          // 一次拉多少张（remaining 是整个队列长度，不受它影响）
    TIMEOUT_MS: 8000,   // 复习相关请求的超时：服务抽风也不许把界面吊死
    BLANK: "▓▓▓",       // 遮挡格固定三格，不按词长给（数格子会泄露词长）
    HINT: "复习 // [空格] 翻面 · [J] 会 · [K] 不会 · [Esc] 回播放 · [V] 切界面"
  }
};

/* 界面清单：加一个界面就在这儿加一行（id / 标签 / 进入时的钩子）。
   顺序即 [V] 的循环顺序：播放 → 内容库 → 生词本 → 复习 → 播放。 */
var VIEWS = [
  { id: "play",   label: "播放" },
  { id: "lib",    label: "内容库", enter: function(){ loadLibrary(); } },
  { id: "vocab",  label: "生词本", enter: function(){ loadVocab(); } },
  { id: "review", label: "复习",   enter: function(){ enterReview(); } }
];

/* ========== 小工具 ========== */
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function fmtTime(t){
  if (!isFinite(t) || t < 0) t = 0;
  var m = Math.floor(t / 60), s = Math.floor(t % 60);
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function setStatus(msg, kind){
  // 复习界面期间状态栏归它用（显示快捷键提示）：别的模块这会儿要写状态就先存着，
  // 离开复习时原样还回去——免得后台一条"拉取字幕完成"把提示冲掉。
  if (R && R.statusSave && msg !== CONF.REVIEW.HINT) {
    R.statusSave = { text: String(msg), kind: kind || "" };
    return;
  }
  $("status").textContent = msg;
  $("dot").className = kind || "";
}
async function api(path, opts){
  var r = await fetch(path, opts);
  if (!r.ok) {
    var detail = "";
    try { detail = (await r.json()).detail || ""; } catch (e) { detail = ""; }
    var err = new Error("HTTP " + r.status + (detail ? " " + detail : ""));
    err.status = r.status;
    throw err;
  }
  return r.json();
}
/* 带超时的 api()：服务/网络抽风时也要在 ms 毫秒内抛出来，
   由调用方画"失败 + 重试"，绝不把界面吊在"载入中"上（复习界面全走这个）。 */
async function apiTimeout(path, opts, ms){
  var o = {};
  for (var k in (opts || {})) if (Object.prototype.hasOwnProperty.call(opts, k)) o[k] = opts[k];
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = null, timedOut = false;
  if (ctl) {
    o.signal = ctl.signal;
    timer = setTimeout(function(){ timedOut = true; ctl.abort(); }, ms || 8000);
  }
  try {
    return await api(path, o);
  } catch (e) {
    throw timedOut ? new Error("请求超时（" + Math.round((ms || 8000) / 1000) + "s）") : e;
  } finally {
    if (timer) clearTimeout(timer);
  }
}
/* 词典释义里的分隔符是字面两个字符 "\n"（见 build_ecdict._clean_text），
   顺手也吃真换行。 */
function glossLines(g){
  return String(g == null ? "" : g).split(/\\n|\n/)
    .map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length > 0; });
}
/* 与服务端 _clean_surface 同口径：小写 + 撇号归一 + 剥首尾标点 */
function normSurface(raw){
  var s = String(raw == null ? "" : raw).toLowerCase()
    .replace(/[’ʼ]/g, "'");
  return s.replace(/^["'“”‘’.,!?;:()\[\]{}…\-—–]+/, "")
          .replace(/["'“”‘’.,!?;:()\[\]{}…\-—–]+$/, "");
}
function playVideo(){
  var p = video.play();
  if (p && p.catch) p.catch(function(){});
}

/* ========== 状态 ========== */
var S = {
  episodes: [],
  contentId: null,
  segments: [],
  mode: 2,               // 默认档 2（只遮中文），DESIGN §4 核心学习模式
  segIndex: -1,
  pauseOnClick: true,    // 只存在 JS 变量里（禁用任何浏览器存储 API）
  pausedByCard: false,
  card: null,            // 当前查询卡数据
  view: null,            // 当前界面（VIEWS 里的 id），启动时由 setView 落位
  resumeOnReturn: false, // 离开播放界面前是否正在播（切回来恢复原状态）
  seeking: false,
  renderKey: "",
  fallbackNoted: false,
  maskBand: null,        // 当前遮罩带 [topRef, bottomRef]，null = 不遮
  maskSample: null,      // 取样区 [topRef-PAD, bottomRef]（背景参考行在带外）
  maskDirty: true,       // 有新帧/新几何待处理（只认新帧上屏，不认 currentTime）
  mnemoTimer: null,      // 查询卡的助记轮询
  mnemoLexeme: null,
  vocabToken: 0,         // 生词本重载令牌（防止旧请求写进新界面）
  libToken: 0,           // 内容库重载令牌（同上）
  importing: false       // 正在导入（期间禁掉表单，别并发两条流水线）
};

var video = $("video");

/* ========== 几何：参考帧坐标 → 屏幕像素 ==========
   <video> 用 object-fit:contain，画面实际区域比元素小（letterbox）。
   先算画面区域，再按 1920x1080 参考帧等比映射。 */
function stageGeom(){
  var r = video.getBoundingClientRect();
  var vw = video.videoWidth || CONF.REF_W;
  var vh = video.videoHeight || CONF.REF_H;
  if (!r.width || !r.height) return { x:0, y:0, w:0, h:0, sx:0, sy:0 };
  var scale = Math.min(r.width / vw, r.height / vh);
  var w = vw * scale, h = vh * scale;
  return {
    x: (r.width - w) / 2,       // letterbox 左右留白
    y: (r.height - h) / 2,      // letterbox 上下留白
    w: w, h: h,
    sx: w / CONF.REF_W,         // 参考帧 → 屏幕
    sy: h / CONF.REF_H
  };
}
function placeRef(node, x, y, w, h, g){
  node.style.left   = (g.x + x * g.sx) + "px";
  node.style.top    = (g.y + y * g.sy) + "px";
  node.style.width  = Math.max(0, w * g.sx) + "px";
  node.style.height = Math.max(0, h * g.sy) + "px";
}

/* ========== 段定位（预排序 + 二分） ========== */
function findSegment(t){
  var segs = S.segments, lo = 0, hi = segs.length - 1, ans = -1;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if (segs[mid].t_start <= t) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  if (ans >= 0 && t <= segs[ans].t_end) return ans;
  return -1;
}
function curSeg(){
  return S.segIndex >= 0 ? S.segments[S.segIndex] : null;
}

/* ========== 词框可用性判定（退路开关） ========== */
function usableBoxes(seg){
  var b = seg && seg.word_boxes;
  if (!b || !b.length) return null;
  var good = [];
  for (var i = 0; i < b.length; i++) {
    var w = b[i];
    if (w && w.x != null && w.y != null && w.width > 0 && w.height > 0 && w.w) good.push(w);
  }
  if (!good.length) return null;
  // 丢框不丢词：个别词没框就跳过；整段大面积丢框才退化为自渲染
  if (good.length < b.length * CONF.BOX_MIN_RATIO) return null;
  return good;
}

/* ========== 遮罩：canvas 高亮抑制 ==========
   目标是"画面自然延续、只是没有字"，不是黑条。
   降级链：canvas 不可用 / tainted / 连续超时 → CSS backdrop-filter 档。 */
var MK = {
  ctx: null,           // 小画布的 2d 上下文（同时也是显示用的那张）
  ok: true,            // false = 已降级到 CSS 档
  inited: false,
  over: 0,             // 连续超预算帧数
  frames: 0,
  lastMs: 0,
  lastAt: 0,           // 上次成功处理的时刻（节流用）
  avgMs: 0,
  rvfc: false          // 是否挂上了 requestVideoFrameCallback
};

/* 什么时候该重画：只认"有新帧上屏 / 几何变了"，**不认 currentTime**。
   seek 之后解码器往往还在吐旧帧：按 currentTime 判重会把那张脏帧永久缓存下来
   （暗夜戏里就表现为一条亮白涂抹——白字的亮度来自另一帧）。 */
function markMaskDirty(){ S.maskDirty = true; }

/* 首选 requestVideoFrameCallback：它只在新帧真正上屏时回调，
   播放中、暂停后 seek 都准。挂不上就靠 seek 后补几枪 + 兜底轮询。 */
function hookVideoFrames(){
  if (typeof video.requestVideoFrameCallback !== "function") return;
  MK.rvfc = true;
  var tick = function(){
    markMaskDirty();
    try { video.requestVideoFrameCallback(tick); } catch (e) { MK.rvfc = false; }
  };
  try { video.requestVideoFrameCallback(tick); } catch (e) { MK.rvfc = false; }
}
function scheduleMaskRefresh(){    // seek / 换源之后补画（没有 rVFC 的浏览器靠这个）
  [120, 350, 800, 1600].forEach(function(ms){ setTimeout(markMaskDirty, ms); });
}

function degradeMask(why){
  if (!MK.ok) return;
  MK.ok = false;
  $("mask").classList.add("cssblur");
  $("maskcv").dataset.painted = "0";
  setStatus("遮罩降级为 CSS 模糊档（" + why + "）", "warn");
}

function maskCtx(){
  if (!MK.ok) return null;
  if (!MK.inited) {
    MK.inited = true;
    try {
      var cv = $("maskcv");
      MK.ctx = cv.getContext("2d", { willReadFrequently: true }) || cv.getContext("2d");
    } catch (e) { MK.ctx = null; }
    if (!MK.ctx) { degradeMask("canvas 不可用"); return null; }
  }
  return MK.ctx;
}

function median(arr, n){        // 小数组插入排序取中位数（n ≤ 7）
  for (var i = 1; i < n; i++) {
    var v = arr[i], j = i - 1;
    while (j >= 0 && arr[j] > v) { arr[j + 1] = arr[j]; j--; }
    arr[j + 1] = v;
  }
  return arr[n >> 1];
}

/* 高亮抑制：把带内偏离"背景"的像素（白字 + 黑描边）拉回背景色。
   背景 = 每列在带外 pad 行的中位数，再横向中位数平滑一次
   （个别列被字戳到也不怕）。偏离小的像素是真画面，原样保留。 */
function suppressHighlights(d, w, h, padRows){
  var M = CONF.MASK, R = M.WIN;
  var rows = Math.max(1, Math.min(padRows, h - 1));
  var base = new Float32Array(w * 3);
  var col = new Float32Array(rows);
  var win = new Float32Array(2 * R + 1);
  var x, c, r, k, m;

  for (c = 0; c < 3; c++) {
    for (x = 0; x < w; x++) {
      for (r = 0; r < rows; r++) col[r] = d[(r * w + x) * 4 + c];
      base[x * 3 + c] = median(col, rows);
    }
  }
  // 横向中位数平滑（就地改会污染窗口，先复制一份）
  var raw = base.slice();
  for (c = 0; c < 3; c++) {
    for (x = 0; x < w; x++) {
      m = 0;
      for (k = -R; k <= R; k++) {
        var xx = x + k;
        if (xx < 0 || xx >= w) continue;
        win[m++] = raw[xx * 3 + c];
      }
      base[x * 3 + c] = median(win, m);
    }
  }

  for (var y = 0; y < h; y++) {
    for (x = 0; x < w; x++) {
      var q = (y * w + x) * 4, b = x * 3;
      var br = base[b], bg = base[b + 1], bb = base[b + 2];
      var L = 0.299 * d[q] + 0.587 * d[q + 1] + 0.114 * d[q + 2];
      var BL = 0.299 * br + 0.587 * bg + 0.114 * bb;
      var a = (Math.abs(L - BL) - M.FLOOR) / M.RANGE;
      a = (a < 0 ? 0 : (a > 1 ? 1 : a)) * M.STRENGTH;
      if (a > 0) {
        d[q]     = d[q]     * (1 - a) + br * a;
        d[q + 1] = d[q + 1] * (1 - a) + bg * a;
        d[q + 2] = d[q + 2] * (1 - a) + bb * a;
      }
      d[q + 3] = 255;
    }
  }
}

function paintMask(force){
  var band = S.maskBand, sample = S.maskSample;
  var cv = $("maskcv");
  if (!band || !sample) { cv.dataset.painted = "0"; return; }
  if (!MK.ok) return;
  var now = (window.performance || Date).now();
  if (!force) {
    if (!S.maskDirty) return;                        // 没新帧就不折腾 CPU
    if (now - MK.lastAt < CONF.SYNC_MS) return;      // 播放中按 SYNC_MS 节流
  }
  var vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh || video.readyState < 1) return;   // 连尺寸都没有，等下一轮

  var M = CONF.MASK;
  // 取样区 = 遮罩带 + 带上方 PAD 行（那里没有字，当背景参考；画布靠 CSS 负偏移
  // 顶出可视区，被 .mask 的 overflow:hidden 裁掉，所以不会盖住画面）
  var sy = clamp(sample[0] / CONF.REF_H * vh, 0, vh - 1);
  var sh = clamp((sample[1] - sample[0]) / CONF.REF_H * vh, 1, vh - sy);
  var w = clamp(Math.round(vw / M.DOWN_X), M.MIN_W, M.MAX_W);
  var h = clamp(Math.round(sh / M.DOWN_Y), M.MIN_H, M.MAX_H);
  var padRows = clamp(Math.round((band[0] - sample[0]) / (sample[1] - sample[0]) * h),
                      1, Math.max(1, h - 2));

  var ctx = maskCtx();
  if (!ctx) return;
  var t0 = (window.performance || Date).now();
  try {
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    ctx.clearRect(0, 0, w, h);                // 清空 → 下面用 alpha 判断有没有真画上
    ctx.drawImage(video, 0, sy, vw, sh, 0, 0, w, h);
    var img = ctx.getImageData(0, 0, w, h);   // 同源视频，不会 tainted
    // 解码器还没吐帧时 drawImage 是空操作（readyState 未必如实反映）：
    // 画布仍然全透明 → 这一轮不算数，dirty 保持置位，下一轮再来
    var got = false;
    for (var i = 3; i < img.data.length; i += 4) { if (img.data[i]) { got = true; break; } }
    if (!got) { cv.dataset.painted = "0"; return; }   // 画布已被清空，标志跟着说实话
    suppressHighlights(img.data, w, h, padRows);
    ctx.putImageData(img, 0, 0);
  } catch (e) {
    degradeMask(String((e && e.name) || e));
    return;
  }
  var ms = (window.performance || Date).now() - t0;
  MK.frames++;
  MK.lastMs = ms;
  // 第一帧含 JIT / 显存分配，不进均值（否则均值永远被那一下拖着）
  if (MK.frames > 1) MK.avgMs = MK.avgMs ? MK.avgMs * 0.85 + ms * 0.15 : ms;
  MK.lastAt = (window.performance || Date).now();
  S.maskDirty = false;                        // 这一帧处理完了，等下一帧上屏
  cv.dataset.painted = "1";
  cv.dataset.frames = String(MK.frames);
  cv.dataset.pad = String(padRows);

  // 性能红线：连续超预算就降级，绝不为了好看拖垮播放
  MK.over = ms > M.BUDGET_MS ? MK.over + 1 : 0;
  if (MK.over >= M.OVER_LIMIT) degradeMask("单帧处理超 " + M.BUDGET_MS + "ms");
  window.__maskStats = { frames: MK.frames, lastMs: MK.lastMs, avgMs: MK.avgMs,
                         w: w, h: h, pad: padRows, rvfc: MK.rvfc,
                         mode: MK.ok ? "canvas" : "css" };
}

/* ========== 渲染 ========== */
function render(force){
  var g = stageGeom();
  var seg = curSeg();
  var key = [S.mode, seg ? seg.id : 0, Math.round(g.w), Math.round(g.h)].join("|");
  if (!force && key === S.renderKey) return;
  S.renderKey = key;

  var mask = $("mask"), hots = $("hots"), fb = $("fbline");
  clear(hots);
  clear(fb);
  fb.classList.remove("on");
  mask.classList.remove("on");
  S.maskBand = null;

  // 档 3 是裸听：文字面板也不能漏字幕（否则遮了画面等于白遮）
  $("segtext").textContent = (!seg || S.mode === 3)
    ? (S.mode === 3 && seg ? "（裸听：字幕已隐藏，切 1 / 2 查看）" : "—")
    : seg.text_en.replace(/\n/g, " ");
  if (!g.w) return;

  var boxes = seg ? usableBoxes(seg) : null;
  var fallback = !!seg && !boxes;

  // --- 遮罩 ---
  if (S.mode === 3) {
    S.maskBand = [CONF.CN_BAND[0], CONF.EN_BAND[1]];
  } else if (S.mode === 2) {
    // 有词框：只遮中文行，英文照旧原位可点
    // 无词框（退路）：中英全遮 + 下沿自渲染可点击英文行（DESIGN §4 对齐退路）
    S.maskBand = [CONF.CN_BAND[0], fallback ? CONF.EN_BAND[1] : CONF.CN_BAND[1]];
  }
  if (S.maskBand) {
    placeRef(mask, 0, S.maskBand[0], CONF.REF_W, S.maskBand[1] - S.maskBand[0], g);
    mask.classList.add("on");
    // 画布比遮罩带高出 PAD 行（背景取样区），用负偏移顶上去、由遮罩裁掉
    S.maskSample = [Math.max(0, S.maskBand[0] - CONF.MASK.PAD), S.maskBand[1]];
    var cv = $("maskcv");
    cv.style.top = ((S.maskSample[0] - S.maskBand[0]) * g.sy) + "px";
    cv.style.height = ((S.maskSample[1] - S.maskSample[0]) * g.sy) + "px";
  } else {
    S.maskSample = null;
  }
  paintMask(true);

  // --- 热区 / 退路字幕 ---
  if (S.mode !== 3 && seg) {
    if (boxes) {
      for (var i = 0; i < boxes.length; i++) renderHot(hots, boxes[i], seg, g);
    } else if (S.mode === 2) {
      renderFallbackLine(fb, seg, g);
    }
    // 档 1 无词框：DESIGN §4 明写「档 1 降级为仅展示不可点」，不自渲染（画面本来就有字）
  }
  updateHint(seg, boxes, fallback);
}

function renderHot(host, box, seg, g){
  var d = el("div", "hot");
  d.dataset.surface = box.w;
  d.title = box.w;
  placeRef(d, box.x - CONF.HOT_PAD, box.y - CONF.HOT_PAD,
           box.width + CONF.HOT_PAD * 2, box.height + CONF.HOT_PAD * 2, g);
  d.addEventListener("click", function(ev){
    ev.stopPropagation();
    openCard(box.w, seg, d);
  });
  host.appendChild(d);
}

function renderFallbackLine(host, seg, g){
  // 定位在遮罩下沿（英文行那一条），字号跟着画面缩放走
  placeRef(host, 0, CONF.EN_BAND[0], CONF.REF_W, CONF.EN_BAND[1] - CONF.EN_BAND[0], g);
  var band = (CONF.EN_BAND[1] - CONF.EN_BAND[0]) * g.sy;
  host.style.fontSize = Math.max(11, band * 0.56) + "px";
  var line = el("div");
  var text = seg.text_en, toks = seg.tokens || [], pos = 0;
  for (var i = 0; i < toks.length; i++) {
    var tk = toks[i];
    if (tk.char_start > pos) line.appendChild(document.createTextNode(text.slice(pos, tk.char_start)));
    (function(word){
      var sp = el("span", "tk", text.slice(word.char_start, word.char_end));
      sp.dataset.surface = word.surface;
      sp.addEventListener("click", function(ev){
        ev.stopPropagation();
        openCard(word.surface, seg, sp);
      });
      line.appendChild(sp);
    })(tk);
    pos = tk.char_end;
  }
  if (pos < text.length) line.appendChild(document.createTextNode(text.slice(pos)));
  if (!toks.length) line.appendChild(document.createTextNode(text));
  host.appendChild(line);
  host.classList.add("on");
}

function updateHint(seg, boxes, fallback){
  if (!seg) return;
  if (fallback && !S.fallbackNoted) {
    S.fallbackNoted = true;
    setStatus(S.mode === 1
      ? "第 " + seg.idx + " 段无可用词框 → 档 1 降级为仅展示不可点（DESIGN §4）"
      : "第 " + seg.idx + " 段无可用词框 → 已启用自渲染字幕退路（档 2 中英全遮）", "warn");
  } else if (boxes) {
    var lost = (seg.word_boxes ? seg.word_boxes.length : 0) - boxes.length;
    if (S.fallbackNoted || lost > 0) {
      S.fallbackNoted = false;
      setStatus("档 " + S.mode + " // 热区 " + boxes.length + " 个" +
                (lost > 0 ? " // " + lost + " 个词丢框不可点" : ""), lost > 0 ? "warn" : null);
    }
  }
}

/* ========== 同步 ========== */
function sync(){
  var t = video.currentTime || 0;
  var i = findSegment(t);
  if (i !== S.segIndex) S.segIndex = i;
  render(false);
  if (S.view === "play") paintMask(false);   // 没新帧时 paintMask 自己会跳过
  if (!S.seeking) {
    var dur = isFinite(video.duration) ? video.duration : 0;
    if (dur && $("seek").max != dur) $("seek").max = dur;
    $("seek").value = t;
    $("time").textContent = fmtTime(t) + " / " + fmtTime(dur);
  }
}

/* ========== 助记渲染（查询卡 / 生词本共用） ==========
   /mnemonic 返回形状（app/server.py 实测）：
   {lexeme_id, lemma, status: done|queued|running|failed|none,
    mnemonics:[{id, kind, payload, provider, version, edited_by_user}], job|null}
   kind="gloss" 的 payload 是 {text}；hook 行的 payload 是 {type, text, label}。 */
function hookBase(kind){
  return String(kind || "").split("#")[0];
}
/* 助记正文里的换行与词典释义同口径：字面两个字符 "\n" 也当换行拆
   （dict_gloss 会被 provider 抄进 context_gloss，那个分隔符就跟着流进来）。
   拆完用真换行拼回去，靠 CSS white-space:pre-wrap 显示。 */
function mnemoText(s){
  return glossLines(s).join("\n");
}
function paintMnemo(host, data){
  if (!host) return;
  clear(host);
  var status = data && data.status ? String(data.status) : "none";
  var state = status === "queued" || status === "running" ? "annotating" : status;
  host.dataset.state = state;
  if (state === "none") return;   // 无 job：整区不显示（CSS 隐藏）

  host.appendChild(el("div", "mhead", "■ 助记 // AI"));
  if (state === "annotating") {
    host.appendChild(el("div", "wait", "助记生成中…"));
    return;
  }
  if (state === "failed") {
    host.appendChild(el("div", "notice", "助记生成失败（重跑 annotate worker 可再试）"));
    return;
  }
  var rows = (data && data.mnemonics) || [];
  var gloss = rows.filter(function(m){ return hookBase(m.kind) === "gloss"; })[0];
  if (gloss && gloss.payload && gloss.payload.text) {
    host.appendChild(el("div", "mgloss", mnemoText(gloss.payload.text)));
  }
  rows.forEach(function(m){
    if (hookBase(m.kind) === "gloss") return;
    var p = m.payload || {};
    if (!p.text) return;
    var box = el("div", "hook");
    box.dataset.type = hookBase(p.type || m.kind);
    box.appendChild(el("span", "badge", hookBase(p.type || m.kind)));
    box.appendChild(el("span", "htext", mnemoText(p.text)));
    if (p.label) box.appendChild(el("span", "lbl", mnemoText(p.label)));
    host.appendChild(box);
  });
}

/* 查询卡的轮询：卡开着才轮，2s 一次，最多 MAX_MS */
function stopMnemoPoll(){
  if (S.mnemoTimer) { clearTimeout(S.mnemoTimer); S.mnemoTimer = null; }
  S.mnemoLexeme = null;
}
function startMnemoPoll(lexemeId){
  stopMnemoPoll();
  if (!lexemeId) return;
  S.mnemoLexeme = lexemeId;
  var t0 = Date.now();
  (async function tick(){
    if (S.mnemoLexeme !== lexemeId || !S.card) return;
    var d = null;
    try {
      d = await api("/mnemonic?lexeme_id=" + encodeURIComponent(lexemeId));
    } catch (e) {
      d = null;   // 助记是旁路，拉不到就当没有，绝不弹错打断看剧
    }
    if (S.mnemoLexeme !== lexemeId || !S.card) return;
    S.card.mnemo = d;
    paintMnemo($("cardMnemo"), d);
    var st = d && d.status;
    if (st === "queued" || st === "running") {
      if (Date.now() - t0 < CONF.MNEMO.MAX_MS) {
        S.mnemoTimer = setTimeout(tick, CONF.MNEMO.POLL_MS);
        return;
      }
    }
    stopMnemoPoll();
  })();
}

/* ========== 查询卡 ========== */
async function openCard(surface, seg, anchor){
  var norm = normSurface(surface);
  if (!norm) return;
  if (S.pauseOnClick && !video.paused) {
    video.pause();
    S.pausedByCard = true;
  }
  document.querySelectorAll(".hot.act").forEach(function(n){ n.classList.remove("act"); });
  if (anchor && anchor.classList.contains("hot")) anchor.classList.add("act");

  stopMnemoPoll();
  S.card = { surface: norm, seg: seg, data: null, mnemo: null, loading: true };
  drawCard();
  try {
    var d = await api("/lookup?surface=" + encodeURIComponent(norm) +
                      "&segment_id=" + encodeURIComponent(seg.id));
    if (!S.card || S.card.surface !== norm) return;   // 期间点了别的词
    S.card.data = d;
    S.card.loading = false;
    drawCard();
    if (d.collected && d.lexeme_id) startMnemoPoll(d.lexeme_id);
  } catch (e) {
    if (!S.card) return;
    S.card.loading = false;
    S.card.error = String(e.message || e);
    drawCard();
  }
}

function drawCard(){
  var card = $("card"), body = $("cardBody");
  clear(body);
  if (!S.card) {
    card.classList.remove("on");
    card.dataset.state = "idle";
    return;
  }
  card.classList.add("on");

  var c = S.card, d = c.data;
  // data-state 是卡片的终态标志：done 之后内容才齐（E2E 断言等这个）
  if (c.loading) {
    card.dataset.state = "loading";
    body.appendChild(el("div", "k", "查询中…"));
    return;
  }
  if (c.error) {
    card.dataset.state = "error";
    body.appendChild(el("div", "notice", "查询失败：" + c.error));
    return;
  }

  body.appendChild(row("当前形式", el("span", "surface", d.surface)));
  body.appendChild(row("词元", el("span", "lemma", d.lemma + (d.pos ? "  [" + d.pos + "]" : ""))));
  body.appendChild(row("音标", el("span", "ipa", d.ipa ? "/" + d.ipa + "/" : "—")));

  var gl = el("div", "gloss");
  var lines = glossLines(d.dict_gloss);
  if (lines.length) {
    lines.forEach(function(t){ gl.appendChild(el("div", null, t)); });
  } else {
    gl.appendChild(el("div", "k", "—"));
  }
  body.appendChild(row("释义", gl));

  if (!d.in_dict) {
    body.appendChild(el("div", "notice", "词典未收录（专名？）— 词元按 " + d.lemma + " 记录"));
  }

  // 原句：token 可点，点中的词高亮
  var seg = c.seg;
  var sent = el("div", "sent");
  var text = seg.text_en, toks = seg.tokens || [], pos = 0;
  for (var i = 0; i < toks.length; i++) {
    var tk = toks[i];
    if (tk.char_start > pos) sent.appendChild(document.createTextNode(text.slice(pos, tk.char_start)));
    (function(word){
      var sp = el("span", "tk", text.slice(word.char_start, word.char_end));
      if (normSurface(word.surface) === c.surface) sp.classList.add("hl");
      sp.addEventListener("click", function(ev){
        ev.stopPropagation();
        openCard(word.surface, seg, null);
      });
      sent.appendChild(sp);
    })(tk);
    pos = tk.char_end;
  }
  if (pos < text.length) sent.appendChild(document.createTextNode(text.slice(pos)));
  if (!toks.length) sent.appendChild(document.createTextNode(text));
  body.appendChild(sent);

  var foot = el("div", "cardfoot");
  var btn = el("button", null, d.collected ? "已在生词本" : "加入生词本");
  btn.id = "collectBtn";
  if (d.collected) btn.classList.add("done");
  btn.disabled = !!d.collected;
  btn.addEventListener("click", function(ev){ ev.stopPropagation(); doCollect(); });
  foot.appendChild(btn);
  var msg = el("span", null, "");
  msg.id = "collectMsg";
  if (d.collected) msg.textContent = "已收";
  foot.appendChild(msg);
  body.appendChild(foot);

  // 助记区：收藏过才有 job；轮询结果画在这里（无 job 时 CSS 自动隐藏）
  var mn = el("div", "mnemo");
  mn.id = "cardMnemo";
  mn.dataset.state = "none";
  body.appendChild(mn);
  paintMnemo(mn, c.mnemo);

  card.dataset.state = "done";
}

function row(label, valueNode){
  var r = el("div", "row");
  r.appendChild(el("div", "lb", label));
  var v = el("div", "vl");
  v.appendChild(valueNode);
  r.appendChild(v);
  return r;
}

async function doCollect(){
  if (!S.card || !S.card.data) return;
  var btn = $("collectBtn"), msg = $("collectMsg");
  btn.disabled = true;
  msg.textContent = "写入中…";
  try {
    var d = await api("/collect", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ surface: S.card.surface, segment_id: S.card.seg.id })
    });
    S.card.data.collected = true;
    S.card.data.lexeme_id = d.lexeme_id;
    if (d.ipa && !S.card.data.ipa) S.card.data.ipa = d.ipa;
    if (d.dict_gloss && !S.card.data.dict_gloss) S.card.data.dict_gloss = d.dict_gloss;
    btn.textContent = "已在生词本";
    btn.classList.add("done");
    msg.textContent = d.created ? "已收 // 新词条" : "已收 // 第 " + d.encounters + " 次相遇";
    setStatus("已收藏 " + d.lemma, null);
    // 收藏即排了助记任务（DESIGN §5 高优先级插队）→ 开始轮询
    paintMnemo($("cardMnemo"), { status: "queued", mnemonics: [] });
    startMnemoPoll(d.lexeme_id);
  } catch (e) {
    btn.disabled = false;
    msg.textContent = "失败：" + (e.message || e);
  }
}

function closeCard(silent){
  if (!S.card) return;
  stopMnemoPoll();
  S.card = null;
  $("card").classList.remove("on");
  $("card").dataset.state = "idle";
  clear($("cardBody"));
  document.querySelectorAll(".hot.act").forEach(function(n){ n.classList.remove("act"); });
  if (S.pausedByCard) {
    S.pausedByCard = false;
    if (!silent) playVideo();
  }
}

/* ========== 生词本界面（M0 只读 + 助记展示） ========== */
async function loadVocab(){
  var host = $("vlist"), token = ++S.vocabToken;
  var d;
  try {
    d = await api("/vocab");
  } catch (e) {
    if (token !== S.vocabToken) return;
    clear(host);
    $("vcount").textContent = "—";
    host.appendChild(el("div", "empty", "生词本加载失败：" + (e.message || e)));
    return;
  }
  if (token !== S.vocabToken) return;
  clear(host);
  var vocab = d.vocab || [];
  var encs = vocab.reduce(function(a, v){ return a + (v.encounter_count || 0); }, 0);
  $("vcount").textContent = d.count
    ? d.count + " 词 // " + encs + " 次相遇"
    : "空";
  if (!d.count) {
    host.appendChild(el("div", "empty",
      "生词本还是空的。\n切到「播放」界面，在画面上点一个英文词并收藏，它就会出现在这里。"));
    return;
  }
  vocab.forEach(function(v){ host.appendChild(vocabCard(v, token)); });
}

function vocabCard(v, token){
  var c = el("div", "vcard");
  c.dataset.lexemeId = String(v.lexeme_id);

  var top = el("div", "top");
  top.appendChild(el("span", "lm", v.lemma));
  if (v.ipa) top.appendChild(el("span", "ip", "/" + v.ipa + "/"));
  if (v.pos) top.appendChild(el("span", "ps", "[" + v.pos + "]"));
  top.appendChild(el("span", "n", (v.encounter_count || 0) + " 次相遇"));
  c.appendChild(top);

  var gl = el("div", "gl");
  var lines = glossLines(v.dict_gloss);
  if (lines.length) {
    lines.forEach(function(t){ gl.appendChild(el("div", null, t)); });
  } else {
    gl.appendChild(el("div", "k", "（暂无词典释义）"));
  }
  c.appendChild(gl);

  // 助记：先按 /vocab 给的 mnemonic_status 占位，再各拉一次 /mnemonic（不轮询）
  var mn = el("div", "mnemo");
  mn.dataset.state = "none";
  c.appendChild(mn);
  var st = v.mnemonic_status || "none";
  if (v.has_mnemonic || st !== "none") {
    paintMnemo(mn, { status: v.has_mnemonic ? "done" : st, mnemonics: [] });
    fetchVocabMnemo(v.lexeme_id, mn, token);
  }

  var encs = v.encounters || [];
  if (encs.length) {
    var box = el("div", "encs");
    box.appendChild(el("div", "eh", "■ 相遇记录 // " + encs.length));
    encs.forEach(function(e){
      var line = el("div", "enc");
      var head = el("div", "ehead");
      // 相遇来源两种（工单 11）：字幕段给「集数 + 时间码 + 去这句」，
      // 网页划词给「🌐 页面标题」——网页没有时间轴，跳不回去也不该有按钮。
      var web = e.source_kind === "web";
      var meta = el("span", "meta", web
        ? "🌐 " + (e.title || e.url || "网页")
        : (e.season_ep ? e.season_ep + " " : "") + fmtTime(e.t_start || 0));
      if (web && e.url) meta.title = e.url;
      head.appendChild(meta);
      head.appendChild(el("em", null, e.surface));
      if (!web && e.content_id != null) {
        var jump = el("button", "jump", "去这句");
        jump.title = "跳到播放界面的这一句";
        jump.addEventListener("click", function(ev){
          ev.stopPropagation();
          jumpTo(e.content_id, e.t_start || 0);
        });
        head.appendChild(jump);
      }
      line.appendChild(head);
      line.appendChild(el("div", "body", (e.sentence || "").replace(/\n/g, " ")));
      box.appendChild(line);
    });
    c.appendChild(box);
  }
  return c;
}

async function fetchVocabMnemo(lexemeId, host, token){

    var d = await api("/mnemonic?lexeme_id=" + encodeURIComponent(lexemeId));
    if (token !== S.vocabToken) return;       // 界面已被重载，别写脏

/* ========== 复习界面（工单 14：翻卡 + 会/不会） ==========
   调度规则一律在服务端（app/review.py）：前端只拉 /review/next 的队列、
   把答案 POST 回 /review/answer，界面上显示的口径全取自接口吐出来的 rules，
   不在这儿复刻一份间隔表（改规则只改后端常量）。 */
var R = {
  cards: [],          // 本次拉到的队列
  i: 0,               // 当前卡在队列里的下标
  remaining: 0,       // 今日剩余（整个队列长度，来自接口）
  done: 0,            // 今日已复习（进来时取 /review/stats，之后本地累加）
  know: 0, dont: 0,   // 今日答对/答错（算答对率）
  stages: null,       // stage 分布 {"0":n,...}
  rules: null,        // 接口吐出来的规则口径
  token: 0,           // 重载令牌（旧请求不许写进新界面）
  mnemoToken: 0,      // 助记请求令牌
  busy: false,        // 正在提交答案（连按不许把同一张卡答两次）
  statusSave: null    // 进复习前的状态栏内容（离开时还原）
};

function reviewRules(){
  /* 口径以接口吐出来的 rules 为准（改常量不用改前端）；下面只是接口还没回来时
     的兜底。间隔表比毕业档少一格是正常的：答对最后一次直接毕业，没有下一次
     到期日（工单 17-5）。 */
  var r = R.rules || {};
  var iv = (r.intervals && r.intervals.length) ? r.intervals : [1, 3];
  var grad = r.graduate_stage || (iv.length + 1);
  return { intervals: iv, graduate: grad };
}
function reviewRuleText(){
  var r = reviewRules();
  return "间隔 " + r.intervals.join("/") + " 天 · 答对 " + r.graduate + " 次毕业";
}

/* 顶部：今日剩余 / 已复习 / 答对率 + stage 分布 + 规则口径 */
function paintReviewBar(){
  var answered = R.know + R.dont;
  var acc = answered ? Math.round(R.know * 100 / answered) + "%" : "—";
  $("rcount").textContent = "今日剩余 " + R.remaining + " 张 · 今日已复习 " +
    R.done + " · 答对率 " + acc;

  var host = $("rstage");
  clear(host);
  var grad = reviewRules().graduate;
  if (R.stages) {
    var parts = [];
    for (var s = 0; s <= grad; s++) {
      parts.push(s + ":" + (R.stages[String(s)] || 0) + (s === grad ? "(毕业)" : ""));
    }
    host.appendChild(el("span", "dist", "档位 " + parts.join(" ") + " // "));
  }
  host.appendChild(el("span", "rule", reviewRuleText()));
}

function showReviewError(e, keepDeck){
  if (!keepDeck) clear($("rdeck"));
  $("rerrmsg").textContent = "复习队列加载失败：" + (e && e.message ? e.message : e);
  $("rerr").hidden = false;
}

async function loadReview(){
  var token = ++R.token;
  R.busy = false;
  var deck = $("rdeck");
  clear(deck);
  deck.appendChild(el("div", "empty rloading", "载入中…"));
  $("rerr").hidden = true;

  var d;
  try {
    d = await apiTimeout("/review/next?limit=" + CONF.REVIEW.LIMIT, null, CONF.REVIEW.TIMEOUT_MS);
  } catch (e) {
    if (token !== R.token) return;
    showReviewError(e);
    return;
  }
  if (token !== R.token) return;
  R.cards = d.cards || [];
  R.i = 0;
  R.remaining = d.remaining || 0;
  R.rules = d.rules || R.rules;

  try {
    var s = await apiTimeout("/review/stats", null, CONF.REVIEW.TIMEOUT_MS);
    if (token !== R.token) return;
    R.done = s.reviewed_today || 0;
    R.know = s.know_today || 0;
    R.dont = s.dont_today || 0;
    R.stages = s.stages || null;
    R.rules = s.rules || R.rules;
  } catch (e) { /* 统计是配菜：拉不到就沿用手头的计数，卡照样能答 */ }
  if (token !== R.token) return;

  paintReviewBar();
  drawReviewCard();
}

function enterReview(){
  R.statusSave = { text: $("status").textContent, kind: $("dot").className };
  setStatus(CONF.REVIEW.HINT);
  loadReview();
}
function leaveReview(){
  var s = R.statusSave;
  if (!s) return;
  R.statusSave = null;      // 先摘掉，setStatus 才会真写进状态栏
  setStatus(s.text, s.kind);
}

/* ---- 例句遮挡：encounter 原形 → 词元 → 词元 4 字前缀，都不中就原样显示 ---- */
function reEscape(s){
  return String(s == null ? "" : s).replace(/[.*+?^${}()|[\]\\\-]/g, "\\$&");
}
function sentenceMatchers(lemma, surface){
  var out = [];
  var sf = String(surface || "").trim(), lm = String(lemma || "").trim();
  if (sf) out.push(new RegExp("\\b" + reEscape(sf) + "\\b", "gi"));
  if (lm && lm.toLowerCase() !== sf.toLowerCase()) {
    out.push(new RegExp("\\b" + reEscape(lm) + "\\b", "gi"));
  }
  var p = lm.slice(0, 4);                       // drive → driving / drives …
  if (p.length === 4) out.push(new RegExp("\\b" + reEscape(p) + "[A-Za-z'’-]*", "gi"));
  return out;
}
/* 句子 → [{t, hit}]。命中的段全部标出来（同一句里出现两次也不许漏一处）。 */
function sentenceParts(text, lemma, surface){
  text = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
  if (!text) return [];
  var res = sentenceMatchers(lemma, surface);
  for (var i = 0; i < res.length; i++) {
    var re = res[i], out = [], last = 0, m, hit = false;
    re.lastIndex = 0;
    while ((m = re.exec(text)) !== null) {
      if (!m[0].length) { re.lastIndex++; continue; }
      hit = true;
      if (m.index > last) out.push({ t: text.slice(last, m.index), hit: false });
      out.push({ t: m[0], hit: true });
      last = m.index + m[0].length;
    }
    if (hit) {
      if (last < text.length) out.push({ t: text.slice(last), hit: false });
      return out;
    }
  }
  return [{ t: text, hit: false }];             // 一个都不中：原样显示，别把句子吞了
}

function paintReviewSentence(node, c, revealed){
  var body = node.querySelector(".rsent .sbody");
  if (!body) return;
  clear(body);
  var enc = c.encounter || {};
  var parts = sentenceParts(enc.sentence, c.lemma, enc.surface);
  if (!parts.length) {
    body.appendChild(el("span", "k", "（这个词没留下原句）"));
    return;
  }
  parts.forEach(function(p){
    if (!p.hit) { body.appendChild(document.createTextNode(p.t)); return; }
    body.appendChild(revealed ? el("span", "hit", p.t)
                              : el("span", "blank", CONF.REVIEW.BLANK));
  });
}

function stageMetaText(c){
  return "stage " + (c.stage || 0) + "/" + reviewRules().graduate;
}
function dueMetaText(c){
  var od = Number(c.overdue_days || 0);
  if (od > 0) return "逾期 " + od + " 天";
  if (od < 0) return (-od) + " 天后到期";
  return "今天到期";
}

function reviewCardNode(c){
  var node = el("div", "rcard");
  node.id = "rcard";
  node.dataset.state = "front";
  node.dataset.lemma = c.lemma || "";
  node.dataset.entry = String(c.vocab_entry_id);
  node.dataset.stage = String(c.stage || 0);

  var head = el("div", "rhead");
  head.appendChild(el("span", "rmeta", stageMetaText(c)));
  head.appendChild(el("span", "rdue", dueMetaText(c)));
  head.appendChild(el("span", "rhint k", "[空格] 翻面"));
  node.appendChild(head);

  var lm = el("div", "rlemma");
  lm.appendChild(el("span", "lmtext", c.lemma || ""));
  if (c.pos) lm.appendChild(el("span", "rpos", "[" + c.pos + "]"));
  node.appendChild(lm);
  node.appendChild(el("div", "ripa", c.ipa ? "/" + c.ipa + "/" : ""));

  // 例句：正面遮词，翻面后还原并可点回原句（两种来源，网页那种没时间轴）
  var enc = c.encounter || null;
  var sent = el("div", "rsent");
  var smeta = el("div", "smeta");
  var web = enc && enc.source_kind === "web";
  var meta = el("span", "meta", !enc ? "—"
    : (web ? "🌐 " + (enc.title || enc.url || "网页")
           : (enc.season_ep ? enc.season_ep + " " : "") + fmtTime(enc.t_start || 0)));
  if (web && enc.url) meta.title = enc.url;
  smeta.appendChild(meta);
  if (enc && !web && enc.content_id != null) {
    var jump = el("button", "jump", "去这句");
    jump.title = "跳到播放界面的这一句";
    jump.addEventListener("click", function(ev){
      ev.stopPropagation();
      jumpTo(enc.content_id, enc.t_start || 0);
    });
    smeta.appendChild(jump);
  }
  sent.appendChild(smeta);
  sent.appendChild(el("div", "sbody"));
  sent.addEventListener("click", function(ev){
    // 没翻面：点例句 = 翻面（先别急着跳走）；翻开了再点才回原片定位
    if (node.dataset.state === "front") { ev.stopPropagation(); flipReviewCard(); return; }
    if (enc && !web && enc.content_id != null) {
      ev.stopPropagation();
      jumpTo(enc.content_id, enc.t_start || 0);
    }
  });
  node.appendChild(sent);

  var back = el("div", "rback");
  var gl = el("div", "rgloss");
  var lines = glossLines(c.dict_gloss);
  if (lines.length) lines.forEach(function(t){ gl.appendChild(el("div", null, t)); });
  else gl.appendChild(el("div", "k", "（暂无词典释义）"));
  back.appendChild(gl);
  var mn = el("div", "mnemo");
  mn.id = "rmnemo";
  mn.dataset.state = "none";
  back.appendChild(mn);
  node.appendChild(back);

  var foot = el("div", "rfoot");
  var know = el("button", "rbtn", "[J] 会");
  know.id = "rknow";
  know.title = "快捷键 J";
  know.addEventListener("click", function(ev){ ev.stopPropagation(); answerReview("know"); });
  var dont = el("button", "rbtn", "[K] 不会");
  dont.id = "rdont";
  dont.title = "快捷键 K";
  dont.addEventListener("click", function(ev){ ev.stopPropagation(); answerReview("dont"); });
  foot.appendChild(know);
  foot.appendChild(dont);
  foot.appendChild(el("span", "rtip", "答完自动下一张"));
  node.appendChild(foot);

  node.addEventListener("click", function(){ flipReviewCard(); });
  paintReviewSentence(node, c, false);
  return node;
}

function reviewEmptyNode(){
  var box = el("div", "empty rempty");
  box.appendChild(el("div", "eh", "■ QUEUE CLEAR // 队列已清空"));
  box.appendChild(el("div", "eb",
    "今天该复习的词都过完了。\n去看剧攒词，明天这批还会按 " +
    reviewRules().intervals.join("/") + " 天的间隔回来找你。"));
  var b = el("button", null, "[ 回播放界面 ]");
  b.id = "rtoplay";
  b.addEventListener("click", function(){ setView("play"); });
  box.appendChild(b);
  return box;
}

function drawReviewCard(){
  var deck = $("rdeck");
  clear(deck);
  var c = R.cards[R.i];
  deck.appendChild(c ? reviewCardNode(c) : reviewEmptyNode());
}

function flipReviewCard(){
  var node = $("rcard"), c = R.cards[R.i];
  if (!node || !c || node.dataset.state !== "front") return;
  node.dataset.state = "revealed";
  var hint = node.querySelector(".rhint");
  if (hint) hint.textContent = "[J] 会 · [K] 不会";
  paintReviewSentence(node, c, true);
  loadReviewMnemo(c);
}

/* 助记是旁路（DESIGN §5）：还在生成就显示"生成中"，拉不到就当没有，都不挡答题 */
async function loadReviewMnemo(c){
  var host = $("rmnemo");
  if (!host) return;
  var st = c.has_mnemonic ? "done" : (c.mnemonic_status || "none");
  paintMnemo(host, { status: st, mnemonics: [] });
  if (st !== "done" || !c.lexeme_id) return;
  var token = ++R.mnemoToken;
  try {
    var d = await apiTimeout("/mnemonic?lexeme_id=" + encodeURIComponent(c.lexeme_id),
                             null, CONF.REVIEW.TIMEOUT_MS);
    if (token !== R.mnemoToken) return;
    if ($("rmnemo") !== host) return;          // 期间翻到下一张了
    paintMnemo(host, d);
  } catch (e) { /* 助记拉不到不弹错：卡片正文照旧 */ }
}

async function answerReview(result){
  var c = R.cards[R.i];
  if (!c || R.busy) return;
  R.busy = true;
  var know = $("rknow"), dont = $("rdont");
  if (know) know.disabled = true;
  if (dont) dont.disabled = true;
  var token = R.token;
  try {
    var d = await apiTimeout("/review/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ vocab_entry_id: c.vocab_entry_id, result: result })
    }, CONF.REVIEW.TIMEOUT_MS);
    if (token !== R.token) return;             // 期间刷新过：这次答案已经落库，界面听新的
    $("rerr").hidden = true;
    R.remaining = d.remaining != null ? d.remaining : Math.max(0, R.remaining - 1);
    if (d.recorded !== false) {
      R.done += 1;
      if (result === "know") R.know += 1; else R.dont += 1;
    }
    // stage 分布本地挪一格（用返回的新 stage 算，不再多打一次 /review/stats）
    if (R.stages && d.stage != null) {
      var from = String(c.stage || 0), to = String(d.stage);
      if (R.stages[from] != null) R.stages[from] = Math.max(0, R.stages[from] - 1);
      R.stages[to] = (R.stages[to] || 0) + 1;
    }
    c.stage = d.stage != null ? d.stage : c.stage;
    R.i += 1;
    paintReviewBar();
    if (R.i >= R.cards.length && R.remaining > 0) {
      R.busy = false;
      await loadReview();                      // 手头这批答完了，队列里还有：再拉一批
      return;
    }
    drawReviewCard();
  } catch (e) {
    showReviewError(e, true);                  // 卡留着，改一行错误提示 + 重试
  } finally {
    R.busy = false;
    if (know) know.disabled = false;
    if (dont) dont.disabled = false;
  }
}

function reviewKey(ev){
  var t = ev.target;
  if (ev.key === " " || ev.key === "Enter") {
    if (t && t.tagName === "BUTTON") t.blur();  // 焦点在按钮上时空格会顺带再点一次
    flipReviewCard();
    ev.preventDefault();
  } else if (ev.key === "j" || ev.key === "J") {
    answerReview("know");
    ev.preventDefault();
  } else if (ev.key === "k" || ev.key === "K") {
    answerReview("dont");
    ev.preventDefault();
  }
}

/* ========== 内容库界面（工单 12：浏览已导入的集 + 导入新集） ========== */
function fmtDur(sec){
  sec = Math.max(0, Math.round(Number(sec) || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var mm = (m < 10 ? "0" : "") + m, ss = (s < 10 ? "0" : "") + s;
  return h ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}
function fmtSize(n){
  n = Number(n) || 0;
  if (n <= 0) return "—";
  var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 || n >= 10 ? Math.round(n) : n.toFixed(1)) + u[i];
}

/* 媒体状态一栏：文件在不在 / 有没有音轨。
   has_audio 是导入时 ffprobe 登记的，CLI ingest 进来的老数据是 null（不下结论）。*/
function mediaState(e){
  if (!e.media_name) return { cls: "err", text: "未登记媒体" };
  if (e.media_missing) return { cls: "err", text: "✕ 文件丢失" };
  if (!e.has_video) return { cls: "err", text: "✕ 读不到" };
  if (e.has_audio === false) return { cls: "warn", text: "⚠ 无音轨 · " + fmtSize(e.media_size) };
  return { cls: "", text: "✓ " + fmtSize(e.media_size) };
}

async function loadLibrary(){
  var host = $("liblist"), token = ++S.libToken;
  var d;
  try {
    d = await api("/episodes");
  } catch (e) {
    if (token !== S.libToken) return;
    clear(host);
    $("libcount").textContent = "—";
    host.appendChild(el("div", "empty", "内容库加载失败：" + (e.message || e)));
    return;
  }
  if (token !== S.libToken) return;
  S.episodes = d.episodes || [];
  clear(host);
  $("libcount").textContent = S.episodes.length ? S.episodes.length + " 集" : "空";
  if (!S.episodes.length) {

      "内容库还是空的。\n用下面的「导入剧集」表单加一集（或者命令行跑 python -m app.ingest）。"));

var LIB_COLS = ["se", "ti", "num", "dur", "bx", "ms"];
var LIB_HEAD = ["季/集", "标题", "段数", "时长", "词框", "媒体"];

function libRow(e){
  var r = el("div", "lrow");

    r.className = "lrow head";
    LIB_HEAD.forEach(function(t, i){ r.appendChild(el("span", LIB_COLS[i], t)); });

  }
  r.dataset.contentId = String(e.id);
  r.title = "点这行 → 切到播放界面并选中这一集";
  r.appendChild(el("span", "se", e.season_ep));
  r.appendChild(el("span", "ti", e.title));
  r.appendChild(el("span", "num", e.segments + " 段"));
  r.appendChild(el("span", "dur", fmtDur(e.duration)));
  r.appendChild(el("span", "bx" + (e.has_boxes ? " on" : ""),
                    e.has_boxes ? "✓ " + e.boxes_segments + " 段" : "—"));
  var st = mediaState(e);
  var ms = el("span", "ms" + (st.cls ? " " + st.cls : ""), st.text);
  if (e.warnings && e.warnings.length) ms.title = e.warnings.join("\n");
  r.appendChild(ms);
  r.addEventListener("click", function(){ openEpisode(e.id); });
  return r;
}

/* 内容库点一行 → 播放界面并选中该集 */
async function openEpisode(id){
  setView("play");
  try {
    var sel = $("ep");
    sel.value = String(id);
    if (sel.value !== String(id)) {   // 下拉里还没有这集（刚导入/被别处改过）
      await loadEpisodes(id);
      return;
    }
    if (Number(id) !== Number(S.contentId)) await loadEpisode(id);
  } catch (e) {
    setStatus("加载失败：" + (e.message || e), "err");
  }
}

/* ---- 导入：上传（XHR 进度）→ 轮询合并/入库阶段 ---- */
function setStage(id, state, pct, text){
  var n = $(id);
  n.dataset.state = state;
  n.querySelector(".pbar i").style.width = Math.round(clamp(pct, 0, 1) * 100) + "%";
  n.querySelector(".pv").textContent = text;
}
function resetStages(){
  ["stUpload", "stMerge", "stIngest"].forEach(function(id){ setStage(id, "idle", 0, "—"); });
  $("impWarn").textContent = "";
}
function failRunningStages(msg){
  ["stUpload", "stMerge", "stIngest"].forEach(function(id){
    if ($(id).dataset.state === "run") setStage(id, "err", 1, msg);
  });
}

/* 上传进度只有 XMLHttpRequest 给得了：fetch 要报上传进度得把 body 换成
   ReadableStream（仅 Chrome + HTTP/2 且要 duplex:"half"），本地播放器不值当。
   合并/入库在服务端后台线程里跑，进度靠轮询 GET /import/{job_id}。*/
function uploadImport(fd, onProgress){
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/import");
    xhr.upload.addEventListener("progress", function(ev){
      if (ev.lengthComputable) onProgress(ev.loaded / ev.total, ev.loaded, ev.total);
    });
    xhr.addEventListener("load", function(){
      var body = null;
      try { body = JSON.parse(xhr.responseText); } catch (e) { body = null; }
      if (xhr.status >= 200 && xhr.status < 300 && body && body.job_id) resolve(body);
      else reject(new Error(body && body.detail ? body.detail : "HTTP " + xhr.status));
    });
    xhr.addEventListener("error", function(){ reject(new Error("上传中断（服务断了？）")); });
    xhr.addEventListener("abort", function(){ reject(new Error("上传已取消")); });
    xhr.send(fd);
  });
}

function paintImportJob(j){
  if (j.stage === "probing") setStage("stMerge", "run", 0.06, "校验媒体…");
  else if (j.stage === "merging")
    setStage("stMerge", "run", Math.max(0.06, j.progress),
             Math.round(j.progress * 100) + "% 合并中");
  else if (j.stage === "ingesting") {
    setStage("stMerge", "done", 1, "OK");
    setStage("stIngest", "run", 0.5, "字幕入库…");
  }
  if (j.warnings && j.warnings.length) $("impWarn").textContent = "⚠ " + j.warnings.join("\n⚠ ");
}

function pollImport(jobId){
  return new Promise(function(resolve, reject){
    var t0 = Date.now();
    (function tick(){
      api("/import/" + encodeURIComponent(jobId)).then(function(j){
        paintImportJob(j);
        if (j.stage === "done") return resolve(j);
        if (j.stage === "error") return reject(new Error(j.error || "导入失败"));
        if (Date.now() - t0 > CONF.IMPORT.MAX_MS) return reject(new Error("导入超时，去看服务端日志"));
        setTimeout(tick, CONF.IMPORT.POLL_MS);
      }).catch(reject);
    })();
  });
}

async function runImport(){
  if (S.importing) return;
  var msg = $("impMsg");
  var title = $("impTitle").value.trim(), seasonEp = $("impSeasonEp").value.trim();
  var video = $("impVideo").files[0], srt = $("impSrt").files[0];
  var audio = $("impAudio").files[0], boxes = $("impBoxes").files[0];
  msg.className = "";
  if (!title || !seasonEp) { msg.className = "err"; msg.textContent = "剧名和季/集编号都要填"; return; }
  if (!video || !srt) { msg.className = "err"; msg.textContent = "视频文件和英文 SRT 都要选"; return; }

  var fd = new FormData();
  fd.append("title", title);
  fd.append("season_ep", seasonEp);
  fd.append("video", video, video.name);
  fd.append("srt", srt, srt.name);
  if (audio) fd.append("audio", audio, audio.name);
  if (boxes) fd.append("boxes", boxes, boxes.name);
  var total = video.size + srt.size + (audio ? audio.size : 0) + (boxes ? boxes.size : 0);

  S.importing = true;
  $("impBtn").disabled = true;
  $("impProg").dataset.state = "run";
  resetStages();
  msg.textContent = "导入中…（这个页面别关）";
  setStage("stUpload", "run", 0, "0% / " + fmtSize(total));
  try {
    var started = await uploadImport(fd, function(p){
      setStage("stUpload", "run", p, Math.round(p * 100) + "% / " + fmtSize(total));
    });
    setStage("stUpload", "done", 1, fmtSize(total) + " 已上传");
    setStage("stMerge", "run", 0.06, "校验媒体…");
    var job = await pollImport(started.job_id);
    setStage("stMerge", "done", 1, "OK");
    setStage("stIngest", "done", 1,
             (job.stats && job.stats.segments != null) ? job.stats.segments + " 段" : "OK");
    msg.className = "ok";
    msg.textContent = "导入完成：" + title + " " + seasonEp + "（content_id=" + job.content_id + "）";
    $("impForm").reset();
    await loadLibrary();
    await loadEpisodes(job.content_id);   // 刷新选集下拉并选中新集
    setView("play");                      // 导完直接开看（验收 §7）
  } catch (e) {
    failRunningStages("失败");
    msg.className = "err";
    msg.textContent = "导入失败：" + (e.message || e);
  } finally {
    S.importing = false;
    $("impBtn").disabled = false;
  }
}

/* ========== 界面切换 ========== */
function buildTabs(){
  var host = $("tabs");
  clear(host);
  VIEWS.forEach(function(v){
    var b = el("button", null, "[ " + v.label + " ]");
    b.dataset.view = v.id;
    b.title = "快捷键 V 循环切换";
    host.appendChild(b);
  });
}

function setView(id){
  var target = VIEWS.filter(function(v){ return v.id === id; })[0];
  if (!target || S.view === id) return;

  if (S.view === "play") {
    // 离开播放界面：记住播放状态并暂停（DESIGN §0 看剧是主活动，别在别的界面偷偷放）
    S.resumeOnReturn = !video.paused;
    video.pause();
    closeCard(true);
  }
  if (S.view === "review") leaveReview();   // 状态栏还回进复习之前那句
  S.view = id;
  document.body.dataset.view = id;
  VIEWS.forEach(function(v){
    var node = $("view-" + v.id);
    if (node) node.classList.toggle("on", v.id === id);   // 加 tab 忘了加 section 也不炸
  });
  Array.prototype.forEach.call($("tabs").children, function(b){
    b.classList.toggle("on", b.dataset.view === id);
  });

  if (id === "play") {
    render(true);                                  // 界面刚显示，几何要重算
    if (S.resumeOnReturn) playVideo();             // 切回来恢复原状态
    S.resumeOnReturn = false;
  }
  if (target.enter) target.enter();
}

function cycleView(){
  var i = 0;
  VIEWS.forEach(function(v, k){ if (v.id === S.view) i = k; });
  setView(VIEWS[(i + 1) % VIEWS.length].id);
}

/* ========== 加载数据 ========== */
/* preferId：导入完成后要求落在指定的那一集（验收 §7 自动切换） */
async function loadEpisodes(preferId){
  setStatus("拉取集列表…");
  var d = await api("/episodes");
  S.episodes = d.episodes || [];
  var sel = $("ep");
  clear(sel);
  if (!S.episodes.length) {
    sel.appendChild(el("option", null, "（库里没有内容，去「内容库」界面导入一集）"));
    setStatus("库里还没有内容：切到「内容库」界面导入，或命令行跑 python -m app.ingest", "warn");
    return;
  }
  S.episodes.forEach(function(e){
    var o = el("option", null,
      e.season_ep + "  " + e.title + "  · " + e.segments + " 段" + (e.has_video ? "" : "  [无视频]"));
    o.value = String(e.id);
    sel.appendChild(o);
  });
  var want = preferId == null ? null : S.episodes.filter(function(e){
    return Number(e.id) === Number(preferId);
  })[0];
  var pick = want || S.episodes.filter(function(e){ return e.has_video; })[0] || S.episodes[0];
  sel.value = String(pick.id);
  await loadEpisode(pick.id);
}

async function loadEpisode(id){
  id = Number(id);
  S.contentId = id;
  setStatus("拉取字幕…");
  var d = await api("/segments?content_id=" + id);
  S.segments = (d.segments || []).slice().sort(function(a, b){ return a.t_start - b.t_start; });
  S.segIndex = -1;
  S.renderKey = "";
  S.maskDirty = true;
  S.fallbackNoted = false;
  S.pausedByCard = false;   // 换集不要因为关卡把新片子自动播起来
  closeCard(true);
  video.pause();
  video.src = "/media/" + id;
  video.load();
  var withBoxes = S.segments.filter(function(s){ return !!usableBoxes(s); }).length;
  setStatus(d.season_ep + " " + d.title + " // " + S.segments.length + " 段 // 词框 " +
            withBoxes + " 段" + (withBoxes < S.segments.length ? "（其余走自渲染退路）" : ""));
  render(true);
}

/* ========== 交互绑定 ========== */
function setMode(m){
  S.mode = m;
  Array.prototype.forEach.call($("modes").children, function(b){
    b.classList.toggle("on", Number(b.dataset.mode) === m);
  });
  S.fallbackNoted = false;
  S.maskDirty = true;
  render(true);
}

$("tabs").addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-view]");
  if (b) setView(b.dataset.view);
});
$("modes").addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-mode]");
  if (b) setMode(Number(b.dataset.mode));
});
$("ep").addEventListener("change", function(){
  if ($("ep").value) loadEpisode($("ep").value).catch(function(e){
    setStatus("加载失败：" + (e.message || e), "err");
  });
});
$("pauseChk").addEventListener("change", function(){ S.pauseOnClick = $("pauseChk").checked; });
$("vrefresh").addEventListener("click", function(){ loadVocab(); });
$("librefresh").addEventListener("click", function(){ loadLibrary(); });
$("rrefresh").addEventListener("click", function(){ loadReview(); });
$("rretry").addEventListener("click", function(){ loadReview(); });
$("impForm").addEventListener("submit", function(ev){ ev.preventDefault(); runImport(); });
$("cardX").addEventListener("click", function(ev){ ev.stopPropagation(); closeCard(); });

$("playBtn").addEventListener("click", togglePlay);
function togglePlay(){
  if (video.paused) {
    S.pausedByCard = false;
    var p = video.play();
    if (p && p.catch) p.catch(function(e){ setStatus("播放失败：" + e.message, "err"); });
  } else {
    video.pause();
  }
}
video.addEventListener("play", function(){ $("playBtn").textContent = "⏸ 暂停"; });
video.addEventListener("pause", function(){ $("playBtn").textContent = "▶ 播放"; });
video.addEventListener("click", function(ev){ if (ev.target === video) togglePlay(); });
video.addEventListener("error", function(){
  setStatus("媒体加载失败（该集可能没有登记 video_path，或文件不存在）", "err");
});

$("prevSeg").addEventListener("click", function(){ jumpSeg(-1); });
$("nextSeg").addEventListener("click", function(){ jumpSeg(1); });
function jumpSeg(step){
  if (!S.segments.length) return;
  var i = S.segIndex;
  if (i < 0) {
    var t = video.currentTime || 0;
    i = -1;
    for (var k = 0; k < S.segments.length; k++) {
      if (S.segments[k].t_start <= t) i = k; else break;
    }
    if (step > 0) i = i + 1; // 落在间隙里：下一段就是紧邻的那段
  } else {
    i = i + step;
  }
  i = Math.max(0, Math.min(S.segments.length - 1, i));
  video.currentTime = S.segments[i].t_start + 0.01;
  sync();
}

$("seek").addEventListener("input", function(){
  S.seeking = true;
  $("time").textContent = fmtTime(Number($("seek").value)) + " / " +
    fmtTime(isFinite(video.duration) ? video.duration : 0);
});
$("seek").addEventListener("change", function(){
  video.currentTime = Number($("seek").value);
  S.seeking = false;
  sync();
  $("seek").blur();     // 拖完就把焦点还回去，别让滑块继续截快捷键
});
// 拖动结束（包括没改动值、不会触发 change 的那种点按）也要交还焦点
["pointerup", "pointercancel"].forEach(function(evt){
  $("seek").addEventListener(evt, function(){ $("seek").blur(); });
});

["timeupdate", "seeked", "seeking", "loadedmetadata", "loadeddata", "durationchange",
 "play", "pause"].forEach(function(evt){
  video.addEventListener(evt, function(){ markMaskDirty(); sync(); });
});
// seek 后解码器要过一会儿才把新帧推上屏：补几枪，别把旧帧留在遮罩里
["seeked", "loadeddata"].forEach(function(evt){
  video.addEventListener(evt, scheduleMaskRefresh);
});
hookVideoFrames();
setInterval(sync, CONF.SYNC_MS);

window.addEventListener("resize", function(){ render(true); });
if (window.ResizeObserver) new ResizeObserver(function(){ render(true); }).observe(video);

// 点卡外关卡（捕获阶段拿不到 stopPropagation 之外的干扰）
document.addEventListener("click", function(ev){
  if (!S.card) return;
  if ($("card").contains(ev.target)) return;
  if ($("tabs").contains(ev.target)) return;
  closeCard();
});

document.addEventListener("keydown", function(ev){
  var t = ev.target;
  // 输入类控件里不抢键（含以后新加的输入框：默认按"要打字"处理）。
  // 例外只有 <input type=range>（进度条）：它不吃字符，拖完焦点还留在上面，
  // 再吞掉空格就成了"拖一下进度条播放暂停失灵"。
  var isRange = !!t && t.tagName === "INPUT" && t.type === "range";
  if (t && !isRange && (t.tagName === "INPUT" || t.tagName === "SELECT" ||
                        t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var play = S.view === "play";
  if (ev.key === "v" || ev.key === "V") { cycleView(); ev.preventDefault(); }
  else if (ev.key === "Escape") {
    if (S.card) closeCard();
    else if (!play) setView("play");
  }
  else if (S.view === "review") reviewKey(ev);     // 复习界面自己的一套键
  else if (!play) return;                          // 以下都是播放界面的键
  else if (ev.key === "1" || ev.key === "2" || ev.key === "3") { setMode(Number(ev.key)); ev.preventDefault(); }
  else if (ev.key === " ") {
    // 焦点还在按钮/进度条上时，空格会顺带再激活那个控件一次 → 先摘掉焦点
    if (t && (t.tagName === "BUTTON" || isRange)) t.blur();
    togglePlay();
    ev.preventDefault();
  }
  // ← → 一律 ±5s；进度条聚焦时也压掉它自带的 step 微调（step=0.01，没用）
  else if (ev.key === "ArrowLeft") {
    video.currentTime = Math.max(0, video.currentTime - 5);
    if (isRange) ev.preventDefault();
  }
  else if (ev.key === "ArrowRight") {
    video.currentTime = video.currentTime + 5;
    if (isRange) ev.preventDefault();
  }
});

/* ========== 启动 ========== */
buildTabs();
setView("play");
setMode(2);           // 档 2 是默认档（DESIGN §4 核心学习模式）
loadEpisodes().catch(function(e){
  setStatus("初始化失败：" + (e.message || e), "err");
});

})();
</script>
